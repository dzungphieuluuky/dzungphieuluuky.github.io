            - heading "Font Architect — Diffusion Models" [level=3] [ref=e47]
            - paragraph [ref=e48]: A research project exploring diffusion-based methods for generating high-quality images of Sino-Nôm script by blending content from one image with the style of another. This project presented major challenges in style-content disentanglement and sparked my deep interest in diffusion-based generative modeling.
