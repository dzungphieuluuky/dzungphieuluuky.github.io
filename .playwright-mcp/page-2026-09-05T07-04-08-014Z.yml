            - paragraph [ref=e55]: A capstone project experimenting with ByteDance's looped language model (Ouro-1.4B) to explore its reasoning capabilities beyond traditional transformer architectures. This project pushed my understanding of NLP and revealed the unique mechanics of looped transformer dynamics.
