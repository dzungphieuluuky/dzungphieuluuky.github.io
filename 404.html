---
layout: base
title: "404 | Page not found"
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Be+Vietnam+Pro:wght@400;700&display=swap');

  :root {
    --bg: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #808080;
    --border: #E5E5E5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 16px;
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(180deg, #FDFDFD 0%, #F5F5F5 100%);
  }

  /* The orbiting black hole */
  .black-hole-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .black-hole {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #333333, #000000 70%);
    box-shadow: 0 0 60px 30px rgba(0,0,0,0.35), 0 0 120px 60px rgba(0,0,0,0.15);
    animation: orbit 25s linear infinite;
  }
  @keyframes orbit {
    0%   { top: 10%; left: 10%; }
    25%  { top: 15%; left: 75%; }
    50%  { top: 70%; left: 80%; }
    75%  { top: 65%; left: 15%; }
    100% { top: 10%; left: 10%; }
  }

  /* Minimal content */
  .error-article {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 728px;
    padding: 2rem;
  }
  .error-code {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 8rem;
    font-weight: 700;
    line-height: 0.85;
    letter-spacing: -0.05em;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  .error-title {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 1.5rem;
  }
  .error-sub {
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 0.95rem;
    color: var(--text-tertiary);
    margin-bottom: 2rem;
  }
  .back-link {
    display: inline-block;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 1rem;
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-primary);
    text-decoration: none;
    padding-bottom: 0.15rem;
  }
  .back-link:hover {
    border-bottom-color: var(--text-primary);
    text-decoration: underline;
  }
</style>
</style>

<div class="black-hole-container" aria-hidden="true">
  <div class="black-hole"></div>
</div>

<div class="error-article" role="main">
  <div class="error-code">404</div>
  <h1 class="error-title">Page not found</h1>
  <p class="error-sub">This URL seems to have drifted out of orbit.</p>
  <a class="back-link" href="/">Return to home →</a>
</div>
